<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Try-On (Cart)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .cart-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .cart-item {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      width: 200px;
      text-align: center;
    }

    #canvasWrapper {
      margin-top: 20px;
    }

    canvas {
      border: 1px solid #ccc;
      width: 300px;
      height: 450px;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h2>Your Cart - Virtual Try-On</h2>

  <!-- User uploads their image -->
  <p><strong>Upload your photo:</strong></p>
  <input type="file" id="userImage" accept="image/*">
  <br><br>

  <!-- Cart items (dresses) -->
  <div class="cart-container">
    <div class="cart-item">
      <img src="dress1.png" width="100"><br>
      <p>Red Dress</p>
      <button onclick="tryOn('dress1.png')">Try On</button>
    </div>

    <div class="cart-item">
      <img src="dress2.png" width="100"><br>
      <p>Blue Dress</p>
      <button onclick="tryOn('dress2.png')">Try On</button>
    </div>
  </div>

  <!-- Canvas for displaying try-on -->
  <div id="canvasWrapper">
    <canvas id="tryOnCanvas" width="300" height="450"></canvas>
  </div>

  <script>
    const userInput = document.getElementById('userImage');
    const canvas = document.getElementById('tryOnCanvas');
    const ctx = canvas.getContext('2d');

    let userImg = new Image();
    let dressImg = new Image();

    let userImageLoaded = false;

    // When user uploads image
    userInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        userImg.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Draw user image when loaded
    userImg.onload = () => {
      userImageLoaded = true;
      drawUserImage();
    };

    function drawUserImage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(userImg, 0, 0, canvas.width, canvas.height);
    }

    // Function called when user clicks "Try On"
    function tryOn(dressSrc) {
      if (!userImageLoaded) {
        alert("Please upload your photo first!");
        return;
      }

      dressImg.src = dressSrc;

      dressImg.onload = () => {
        // First draw user image
        drawUserImage();

        // Then overlay dress on top (adjust position & size as needed)
        const dressX = 60;    // move left/right
        const dressY = 100;   // move up/down
        const dressW = 180;   // width
        const dressH = 250;   // height

        ctx.drawImage(dressImg, dressX, dressY, dressW, dressH);
      };
    }
  </script>
</body>
</html>
