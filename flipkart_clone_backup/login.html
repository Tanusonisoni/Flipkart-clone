<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Login Page</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="header">
        <div id="Flipkart">
            <span class="fk-logo">Flipkart</span>
            <span class="fk-explore">Explore</span>
            <span class="fk-plus">Plus</span>
        </div>

        <div class="input">
            <span class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="text" placeholder="Search for products, brands and more">
            </span>
        </div>
        
        <div class="menus">
            <a href="login.html"><button class="btn"><i class="fa-regular fa-circle-user"></i> Login</button></a>
            <a href="#"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
            <a href="#"><i class="fa-solid fa-shop"></i> Become a Seller</a>
        </div>
    </div>

    <div class="container">
        <!-- LOGIN FORM -->
        <div class="form-box active" id="login-form">
            <form id="loginForm">
                <h2>Login</h2>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p>Don't have an account? 
                    <a href="#" onclick="showForm('Register-form')">Register</a>
                </p>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div class="form-box" id="Register-form">
            <form id="registerForm">
                <h2>Register</h2>
                <input type="text" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <select name="role" required>
                    <option value="">--select role--</option>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <button type="submit">Register</button>
                <p>Already have an account? 
                    <a href="#" onclick="showForm('login-form')">Login</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        
        function showForm(formId) {
            document.querySelectorAll(".form-box").forEach(form => form.classList.remove("active"));
            document.getElementById(formId).classList.add("active");
        }

        // handle login
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const email = this.email.value.trim();
            const password = this.password.value.trim();
            if (email && password) {
                //alert("&#127881; Login successful!");
                window.location.href = "index.html"; 
            } else {
                alert("&#9888 Please fill all fields!");
            }
        });

        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const name = this.name.value.trim();
            const email = this.email.value.trim();
            const password = this.password.value.trim();
            const role = this.role.value;
            if (name && email && password && role) {
                alert("&#127881; Registration successful! Now login.");
                showForm("login-form");
            } else {
                alert("&#9888 Please fill all fields!");
            }
        });
    </script>
</body>
</html>
