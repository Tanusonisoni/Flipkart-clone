<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Try-On</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    #canvasWrapper {
      position: relative;
      width: 300px;
      height: 400px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    input, select, button {
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h2>Virtual Try-On</h2>

  <!-- Upload User Image -->
  <label>User Photo:</label>
  <input type="file" id="userImage" accept="image/*">

  <!-- Select Dress -->
  <label>Select Dress:</label>
  <select id="dressSelect">
    <option value="dress1.png">Dress 1</option>
    <option value="dress2.png">Dress 2</option>
  </select>

  <button id="tryOnBtn">Try On</button>

  <!-- Canvas to show result -->
  <div id="canvasWrapper">
    <canvas id="tryOnCanvas"></canvas>
  </div>

  <script src="tryon.js"></script>
</body>
</html>
